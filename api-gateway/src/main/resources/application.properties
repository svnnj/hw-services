spring.application.name=api-gateway

# Server Configuration
server.port=8085

# Logging Configuration
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.example.apigateway=DEBUG

# Eureka Client Configuration (for service discovery)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Static route configuration (for development without service discovery)
# Direct connection to user-service without load balancing
spring.cloud.gateway.routes[0].id=user_service_direct
spring.cloud.gateway.routes[0].uri=http://localhost:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/** 